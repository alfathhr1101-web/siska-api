<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Operator SIS4D</title>
  <link rel="stylesheet" href="/assets/css/operator.css" />
</head>
<body>
  <div class="login-card">
    <img src="/logo.png" class="logo" alt="SIS4D" />
    <h1>SIS4D Operator</h1>
    <p>Masuk ke dashboard operator</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />

      <button type="submit">Masuk</button>
    </form>

    <small>© 2026 SIS4D Control Center</small>
  </div>

  <script src="/assets/js/operator.js"></script>
</body>
</html>
