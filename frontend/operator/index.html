<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator SIS4D</title>
  <style>
    body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0f172a;font-family:Arial}
    .card{width:340px;background:#111827;padding:30px;border-radius:20px;color:#fff;text-align:center}
    input{width:100%;padding:12px;margin:10px 0;border:none;border-radius:10px;background:#1f2937;color:#fff;box-sizing:border-box}
    button{width:100%;padding:12px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h2>Login Operator SIS4D</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Masuk</button>
  </div>
</body>
</html>
