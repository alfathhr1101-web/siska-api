<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SIS4D Operator Panel</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/src/styles/app.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/sidebar.css" />
  <link rel="stylesheet" href="/src/styles/navbar.css" />
  <link rel="stylesheet" href="/src/styles/cards.css" />
  <link rel="stylesheet" href="/src/styles/table.css" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- Main -->
  <div class="main">

    <!-- Navbar -->
    <header id="navbar"></header>

    <!-- Content -->
    <main id="app">

      <!-- loading awal -->
      <div class="page-loading">
        <div class="spinner"></div>
        <p>Memuat dashboard...</p>
      </div>

    </main>

  </div>

  <!-- =========================
       BANK MODAL
  ========================== -->
  <div id="bankModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">
        <h3 id="bankModalTitle">Tambah Bank</h3>
        <button id="closeBankModal" class="modal-close">✕</button>
      </div>

      <div class="modal-body">

        <div class="form-group">
          <label>Nama Bank</label>
          <input id="bankName" type="text" placeholder="BCA DESI" />
        </div>

        <div class="form-group">
          <label>Spreadsheet ID</label>
          <input id="bankSpreadsheet" type="text" placeholder="1abc..." />
        </div>

        <div class="form-group">
          <label>Nama Sheet</label>
          <input id="bankSheet" type="text" placeholder="BCA DESI" />
        </div>

        <div class="form-group">
          <label>Start Row</label>
          <input id="bankStartRow" type="number" value="7" />
        </div>

      </div>

      <div class="modal-footer">
        <button id="cancelBankModal" class="secondary-btn">Batal</button>
        <button id="saveBankBtn" class="primary-btn">Simpan</button>
      </div>

    </div>

  </div>

  <!-- =========================
       TOAST NOTIFICATION
  ========================== -->
  <div id="toast" class="toast hidden"></div>

  <!-- =========================
       SCRIPT
  ========================== -->
  <script type="module" src="/src/main.js"></script>

</body>

</html>
